name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/rpm-turntable-app-2nj0n1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site
        run: |
          mkdir -p _site
          cp index.html guide.html app.css manifest.webmanifest sw.js _site/
          cp -r js icons _site/
          # Stamp the build into the app footer and the cache name, so the running version is
          # visible in the UI and every deploy starts a clean cache.
          BUILD="$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/g" _site/js/app.js _site/sw.js
          echo "Build stamp: $BUILD"
          grep -n "$BUILD" _site/sw.js _site/js/app.js

      # `enablement` only works if the Actions token may administer the repository; when it
      # cannot, switch Pages on by hand once under Settings ▸ Pages ▸ Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
